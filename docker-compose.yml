services:
  hub-db:
    image: mysql:8.4.0
    container_name: hub-db
    restart: unless-stopped
    tty: true
    env_file: .env
    environment:
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -u $${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - "3306:3306"
    networks:
      - internal

  hub-api:
    build:
      context: .
      dockerfile: hub-api/Dockerfile
    container_name: hub-api
    # local dev only
    volumes:
      - ./hub-api:/var/www/html
    depends_on:
      hub-db:
        condition: "service_healthy"
        restart: true

    ports:
      - "8080:80"
    networks:
      - internal

  node:
    build:
      context: ./hub-fe
    container_name: hub-fe
    # local dev only
    volumes:
      - ./hub-fe/src:/app/src
    ports:
      - "8000:3001"
    networks:
      - internal

networks:
  internal:
    driver: bridge
