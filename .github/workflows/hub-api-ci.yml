name: Hub API CI

on:
  push:
    branches: [ "master", "dev" ]
    paths:
      - 'hub-api/**'
  pull_request:
    branches: [ "master", "dev" ]
    paths:
      - 'hub-api/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.5'
        extensions: mbstring, xml, bcmath, dom, curl, fileinfo
        coverage: none # We will setup Codecov later if needed

    - name: Install Dependencies
      working-directory: hub-api
      run: composer install --prefer-dist --no-interaction

    - name: Create .env.testing and .env files
      working-directory: hub-api
      run: |
        cp .env.testing.example .env.testing
        cp .env.example .env

    - name: Generate App Key
      working-directory: hub-api
      run: php artisan key:generate

    - name: Create Database
      working-directory: hub-api
      run: |
        mkdir -p database
        touch database/database.sqlite

    - name: Run Migrations
      working-directory: hub-api
      run: php artisan migrate --force

    - name: Run Tests
      working-directory: hub-api
      run: php artisan test